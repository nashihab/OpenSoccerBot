<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><style>
.title{font:700 30px Arial,sans-serif;fill:#18324a}.subtitle{font:15px Arial,sans-serif;fill:#526273}.h{font:700 20px Arial,sans-serif;fill:#18324a}.b{font:15px Arial,sans-serif;fill:#22313f}.s{font:13px Arial,sans-serif;fill:#526273}.tiny{font:12px Arial,sans-serif;fill:#66727f}.label{font:700 13px Arial,sans-serif;fill:#18324a}.box{fill:#fff;stroke:#b9c6d2;stroke-width:2}.blue{fill:#eaf3fb;stroke:#3978ad;stroke-width:2}.green{fill:#eef7eb;stroke:#67a653;stroke-width:2}.orange{fill:#fff4e9;stroke:#d88a3d;stroke-width:2}.purple{fill:#f4eef9;stroke:#8364a7;stroke-width:2}.wire{stroke:#3b4854;stroke-width:3;fill:none}.sig{stroke:#3978ad;stroke-width:3;fill:none}.pwr{stroke:#c34d4d;stroke-width:3;fill:none}.gnd{stroke:#4c7c57;stroke-width:3;fill:none}.dash{stroke:#7f8b96;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3b4854"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3978ad"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c34d4d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="50" y="46" class="title">RC channel map</text><text x="50" y="73" class="subtitle">Channel numbers are examples; remap them in the sketches when your transmitter is configured differently.</text>
<rect x="50" y="105" width="500" height="300" rx="14" class="blue"/><text x="75" y="140" class="h">BASIC — 2WD</text>
<rect x="75" y="180" width="90" height="42" rx="8" class="box"/><text x="100" y="207" class="label">CH1</text><text x="190" y="198" class="b">Steering</text><text x="190" y="218" class="s">left / right</text><rect x="75" y="244" width="90" height="42" rx="8" class="box"/><text x="100" y="271" class="label">CH2</text><text x="190" y="262" class="b">Throttle</text><text x="190" y="282" class="s">forward / reverse</text><rect x="75" y="308" width="90" height="42" rx="8" class="box"/><text x="100" y="335" class="label">CH5</text><text x="190" y="326" class="b">Kick</text><text x="190" y="346" class="s">momentary or 2-position switch</text><rect x="610" y="105" width="540" height="300" rx="14" class="purple"/><text x="635" y="140" class="h">ADVANCED — 4WD mecanum</text><rect x="635" y="175" width="90" height="32" rx="7" class="box"/><text x="660" y="197" class="label">CH1</text><text x="750" y="191" class="b">Strafe</text><text x="750" y="209" class="s">left / right</text><rect x="635" y="220" width="90" height="32" rx="7" class="box"/><text x="660" y="242" class="label">CH2</text><text x="750" y="236" class="b">Forward</text><text x="750" y="254" class="s">forward / reverse</text><rect x="635" y="265" width="90" height="32" rx="7" class="box"/><text x="660" y="287" class="label">CH4</text><text x="750" y="281" class="b">Rotate</text><text x="750" y="299" class="s">left / right</text><rect x="635" y="310" width="90" height="32" rx="7" class="box"/><text x="660" y="332" class="label">CH5</text><text x="750" y="326" class="b">Kick</text><text x="750" y="344" class="s">momentary / 2-position</text><rect x="635" y="355" width="90" height="32" rx="7" class="box"/><text x="660" y="377" class="label">CH6</text><text x="750" y="371" class="b">Dribbler</text><text x="750" y="389" class="s">on / off</text><rect x="50" y="440" width="1100" height="95" rx="14" class="box"/><text x="75" y="472" class="h">Pulse interface</text><text x="75" y="500" class="b">Typical receiver endpoints: about 1000–2000 µs, center ≈1500 µs.</text><text x="75" y="522" class="s">Calibrate your actual transmitter/receiver; do not assume every radio uses identical endpoints.</text></svg>