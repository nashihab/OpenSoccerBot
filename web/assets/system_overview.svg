<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>
.title{font:700 30px Arial,sans-serif;fill:#18324a}.subtitle{font:15px Arial,sans-serif;fill:#526273}.h{font:700 20px Arial,sans-serif;fill:#18324a}.b{font:15px Arial,sans-serif;fill:#22313f}.s{font:13px Arial,sans-serif;fill:#526273}.tiny{font:12px Arial,sans-serif;fill:#66727f}.label{font:700 13px Arial,sans-serif;fill:#18324a}.box{fill:#fff;stroke:#b9c6d2;stroke-width:2}.blue{fill:#eaf3fb;stroke:#3978ad;stroke-width:2}.green{fill:#eef7eb;stroke:#67a653;stroke-width:2}.orange{fill:#fff4e9;stroke:#d88a3d;stroke-width:2}.purple{fill:#f4eef9;stroke:#8364a7;stroke-width:2}.wire{stroke:#3b4854;stroke-width:3;fill:none}.sig{stroke:#3978ad;stroke-width:3;fill:none}.pwr{stroke:#c34d4d;stroke-width:3;fill:none}.gnd{stroke:#4c7c57;stroke-width:3;fill:none}.dash{stroke:#7f8b96;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3b4854"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3978ad"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c34d4d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="50" y="48" class="title">OpenSoccerBot control architecture</text>
<text x="50" y="76" class="subtitle">Manual RC control only. Standard receiver PWM is the interface between radio equipment and the robot.</text>
<rect x="45" y="112" width="250" height="210" rx="14" class="blue"/>
<text x="70" y="146" class="h">RC transmitter</text>
<text x="70" y="174" class="b">FlySky FS-i6 / FS-i6X</text>
<text x="70" y="198" class="s">or another hobby radio</text>
<rect x="85" y="220" width="170" height="68" rx="10" class="box"/>
<circle cx="120" cy="254" r="14" fill="none" stroke="#18324a" stroke-width="3"/>
<path d="M148 236 h75 M148 254 h55 M148 272 h68" class="dash"/>
<text x="305" y="211" class="label">2.4 GHz</text>
<path d="M295 214 H355" class="sig" marker-end="url(#arrb)"/>
<rect x="355" y="112" width="260" height="210" rx="14" class="green"/>
<text x="380" y="146" class="h">RC receiver</text>
<text x="380" y="174" class="b">Example: FS-iA6B</text>
<text x="380" y="202" class="s">CH1–CH6 servo-style PWM</text>
<text x="380" y="228" class="s">5 V supply + common GND</text>
<rect x="392" y="250" width="195" height="44" rx="8" class="box"/>
<text x="410" y="277" class="label">PWM pulse → MCU GPIO</text>
<path d="M615 215 H685" class="sig" marker-end="url(#arrb)"/>
<rect x="685" y="92" width="465" height="122" rx="14" class="orange"/>
<text x="710" y="126" class="h">BASIC — Arduino Uno</text>
<text x="710" y="153" class="b">2WD differential drive · TB6612FNG · 2 motors</text>
<text x="710" y="179" class="s">CH1 steering · CH2 throttle · CH5 kicker</text>
<rect x="685" y="238" width="465" height="122" rx="14" class="purple"/>
<text x="710" y="272" class="h">ADVANCED — ESP32</text>
<text x="710" y="299" class="b">4WD mecanum · 2× TB6612FNG · dribbler</text>
<text x="710" y="325" class="s">CH1 strafe · CH2 forward · CH4 rotate · CH5/6 mechanisms</text>
<path d="M805 214 V238" class="dash"/>
<rect x="45" y="358" width="1105" height="108" rx="14" class="box"/>
<text x="70" y="391" class="h">Design boundary</text>
<text x="70" y="419" class="b">This repository does not perform autonomous navigation, ball tracking or obstacle avoidance.</text>
<text x="70" y="444" class="s">Those features can be added later without changing the RC/motor architecture.</text>
</svg>