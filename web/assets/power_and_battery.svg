<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>
.title{font:700 30px Arial,sans-serif;fill:#18324a}.subtitle{font:15px Arial,sans-serif;fill:#526273}.h{font:700 20px Arial,sans-serif;fill:#18324a}.b{font:15px Arial,sans-serif;fill:#22313f}.s{font:13px Arial,sans-serif;fill:#526273}.tiny{font:12px Arial,sans-serif;fill:#66727f}.label{font:700 13px Arial,sans-serif;fill:#18324a}.box{fill:#fff;stroke:#b9c6d2;stroke-width:2}.blue{fill:#eaf3fb;stroke:#3978ad;stroke-width:2}.green{fill:#eef7eb;stroke:#67a653;stroke-width:2}.orange{fill:#fff4e9;stroke:#d88a3d;stroke-width:2}.purple{fill:#f4eef9;stroke:#8364a7;stroke-width:2}.wire{stroke:#3b4854;stroke-width:3;fill:none}.sig{stroke:#3978ad;stroke-width:3;fill:none}.pwr{stroke:#c34d4d;stroke-width:3;fill:none}.gnd{stroke:#4c7c57;stroke-width:3;fill:none}.dash{stroke:#7f8b96;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3b4854"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3978ad"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c34d4d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="50" y="46" class="title">Power architecture</text>
<text x="50" y="73" class="subtitle">Protect the battery first, then split into a motor rail and a regulated logic/servo rail.</text>
<rect x="50" y="118" width="190" height="100" rx="12" class="blue"/>
<text x="72" y="150" class="h">Battery</text><text x="72" y="178" class="b">2S / 3S / 4S</text><text x="72" y="202" class="s">chosen from motor rating</text>
<path d="M240 168 H300" class="pwr" marker-end="url(#arrp)"/>
<rect x="300" y="118" width="145" height="100" rx="12" class="orange"/>
<text x="324" y="150" class="h">Fuse</text><text x="324" y="178" class="s">near battery +</text><text x="324" y="201" class="s">protect wiring</text>
<path d="M445 168 H505" class="pwr" marker-end="url(#arrp)"/>
<rect x="505" y="118" width="165" height="100" rx="12" class="purple"/>
<text x="532" y="150" class="h">Master switch</text><text x="532" y="180" class="s">main disconnect</text><text x="532" y="201" class="s">service / emergency</text>
<circle cx="670" cy="168" r="5" fill="#c34d4d"/>
<path d="M675 168 H740" class="pwr" marker-end="url(#arrp)"/>
<path d="M670 168 V305 H740" class="pwr" marker-end="url(#arrp)"/>
<rect x="740" y="108" width="345" height="118" rx="12" class="blue"/>
<text x="765" y="143" class="h">Motor rail</text><text x="765" y="172" class="b">TB6612 VM → motors</text><text x="765" y="200" class="s">Motor voltage must match the actual motor and driver.</text>
<rect x="740" y="280" width="345" height="118" rx="12" class="green"/>
<text x="765" y="315" class="h">Buck / BEC</text><text x="765" y="344" class="b">Battery → regulated 5 V rail</text><text x="765" y="372" class="s">MCU + receiver + servo (with adequate current headroom)</text>
<text x="50" y="455" class="h">Battery layouts</text>
<rect x="50" y="480" width="245" height="92" rx="12" class="box"/><text x="70" y="510" class="label">2S1P</text><text x="70" y="536" class="s">2 cells in series</text><text x="70" y="557" class="tiny">7.4 V nominal / 8.4 V full</text>
<rect x="320" y="480" width="245" height="92" rx="12" class="box"/><text x="340" y="510" class="label">2S2P</text><text x="340" y="536" class="s">two parallel pairs in series</text><text x="340" y="557" class="tiny">7.4 V nominal / ≈2× cell capacity</text>
<rect x="590" y="480" width="245" height="92" rx="12" class="box"/><text x="610" y="510" class="label">3S1P</text><text x="610" y="536" class="s">3 cells in series</text><text x="610" y="557" class="tiny">11.1 V nominal / 12.6 V full</text>
<rect x="860" y="480" width="245" height="92" rx="12" class="box"/><text x="880" y="510" class="label">3S2P</text><text x="880" y="536" class="s">three parallel pairs in series</text><text x="880" y="557" class="tiny">11.1 V nominal / ≈2× cell capacity</text>
<text x="50" y="615" class="tiny">For DIY Li-ion packs: use matched cells, correct S-count BMS, insulated construction and a fuse close to battery positive.</text>
</svg>