<svg xmlns="http://www.w3.org/2000/svg" width="1135" height="600" viewBox="0 0 1135 600"><style>
.title{font:700 30px Arial,sans-serif;fill:#18324a}.subtitle{font:15px Arial,sans-serif;fill:#526273}.h{font:700 20px Arial,sans-serif;fill:#18324a}.b{font:15px Arial,sans-serif;fill:#22313f}.s{font:13px Arial,sans-serif;fill:#526273}.tiny{font:12px Arial,sans-serif;fill:#66727f}.label{font:700 13px Arial,sans-serif;fill:#18324a}.box{fill:#fff;stroke:#b9c6d2;stroke-width:2}.blue{fill:#eaf3fb;stroke:#3978ad;stroke-width:2}.green{fill:#eef7eb;stroke:#67a653;stroke-width:2}.orange{fill:#fff4e9;stroke:#d88a3d;stroke-width:2}.purple{fill:#f4eef9;stroke:#8364a7;stroke-width:2}.wire{stroke:#3b4854;stroke-width:3;fill:none}.sig{stroke:#3978ad;stroke-width:3;fill:none}.pwr{stroke:#c34d4d;stroke-width:3;fill:none}.gnd{stroke:#4c7c57;stroke-width:3;fill:none}.dash{stroke:#7f8b96;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3b4854"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3978ad"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c34d4d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="45" y="42" class="title">ADVANCED — ESP32 / 4WD mecanum wiring</text>
<text x="45" y="68" class="subtitle">Use a PWM receiver. ESP32 GPIO inputs are 3.3 V logic; level-shift any receiver output that can exceed 3.3 V.</text>
<rect x="45" y="95" width="230" height="192" rx="12" class="green"/><text x="68" y="128" class="h">PWM receiver</text><text x="68" y="156" class="b">CH1 → GPIO34</text><text x="68" y="179" class="b">CH2 → GPIO35</text><text x="68" y="202" class="b">CH4 → GPIO36</text><text x="68" y="225" class="b">CH5 → GPIO39</text><text x="68" y="248" class="b">CH6 → GPIO13</text><text x="68" y="270" class="s">5 V + common GND</text>
<path d="M275 175 H350" class="sig" marker-end="url(#arrb)"/>
<rect x="350" y="90" width="300" height="205" rx="12" class="blue"/><text x="375" y="125" class="h">ESP32</text><text x="375" y="153" class="s">Drive: 8–14, 16–27 (see sketch)</text><text x="375" y="181" class="s">Kick servo → GPIO32</text><text x="375" y="209" class="s">Dribbler gate → GPIO33</text><text x="375" y="238" class="s">Mecanum mix in software</text><text x="375" y="266" class="tiny">Do not feed 5 V logic directly into GPIOs.</text>
<path d="M650 170 H725" class="sig" marker-end="url(#arrb)"/>
<rect x="725" y="88" width="365" height="207" rx="12" class="orange"/><text x="750" y="122" class="h">TB6612FNG ×2</text><text x="750" y="151" class="b">Driver A: FL + FR</text><text x="750" y="177" class="b">Driver B: RL + RR</text><text x="750" y="205" class="s">VM ← battery motor rail</text><text x="750" y="229" class="s">VCC ← 3.3 V logic</text><text x="750" y="253" class="s">STBY → 3.3 V</text><text x="750" y="277" class="tiny">Check motor current against your breakout rating.</text>
<rect x="45" y="330" width="1045" height="105" rx="12" class="purple"/><text x="68" y="362" class="h">Mechanisms</text><text x="68" y="390" class="b">Kicker: GPIO32 signal + regulated 5 V power</text><text x="68" y="414" class="b">Dribbler: GPIO33 → logic-level MOSFET → motor; add flyback diode if the module does not include one</text>
<rect x="45" y="465" width="1045" height="100" rx="12" class="box"/><text x="68" y="497" class="h">Power</text><text x="68" y="525" class="b">Battery → fuse → switch → motor drivers</text><text x="68" y="550" class="b">Battery → buck/BEC → receiver + servo; ESP32 from a suitable regulated input</text>
</svg>