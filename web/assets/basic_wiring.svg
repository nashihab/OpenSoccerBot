<svg xmlns="http://www.w3.org/2000/svg" width="1135" height="590" viewBox="0 0 1135 590"><style>
.title{font:700 30px Arial,sans-serif;fill:#18324a}.subtitle{font:15px Arial,sans-serif;fill:#526273}.h{font:700 20px Arial,sans-serif;fill:#18324a}.b{font:15px Arial,sans-serif;fill:#22313f}.s{font:13px Arial,sans-serif;fill:#526273}.tiny{font:12px Arial,sans-serif;fill:#66727f}.label{font:700 13px Arial,sans-serif;fill:#18324a}.box{fill:#fff;stroke:#b9c6d2;stroke-width:2}.blue{fill:#eaf3fb;stroke:#3978ad;stroke-width:2}.green{fill:#eef7eb;stroke:#67a653;stroke-width:2}.orange{fill:#fff4e9;stroke:#d88a3d;stroke-width:2}.purple{fill:#f4eef9;stroke:#8364a7;stroke-width:2}.wire{stroke:#3b4854;stroke-width:3;fill:none}.sig{stroke:#3978ad;stroke-width:3;fill:none}.pwr{stroke:#c34d4d;stroke-width:3;fill:none}.gnd{stroke:#4c7c57;stroke-width:3;fill:none}.dash{stroke:#7f8b96;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3b4854"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3978ad"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c34d4d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="45" y="42" class="title">BASIC — Arduino Uno / 2WD wiring</text>
<text x="45" y="68" class="subtitle">Signal, motor power and regulated logic power are shown separately. All grounds are common.</text>
<rect x="45" y="100" width="220" height="160" rx="12" class="green"/><text x="68" y="132" class="h">RC receiver</text><text x="68" y="161" class="b">CH1 → D2</text><text x="68" y="184" class="b">CH2 → D3</text><text x="68" y="207" class="b">CH5 → A0</text><text x="68" y="232" class="s">+5 V and GND from BEC</text>
<path d="M265 170 H350" class="sig" marker-end="url(#arrb)"/>
<rect x="350" y="90" width="300" height="195" rx="12" class="blue"/><text x="375" y="124" class="h">Arduino Uno</text><text x="375" y="153" class="s">Drive inputs: D2, D3</text><text x="375" y="177" class="s">Kick input: A0</text><text x="375" y="203" class="s">PWM outputs: D5, D6</text><text x="375" y="229" class="s">Direction: D7–D10</text><text x="375" y="255" class="s">STBY: D4</text>
<path d="M650 160 H735" class="sig" marker-end="url(#arrb)"/>
<rect x="735" y="90" width="355" height="195" rx="12" class="orange"/><text x="760" y="124" class="h">TB6612FNG</text><text x="760" y="154" class="b">PWMA D5 · AIN1 D7 · AIN2 D8</text><text x="760" y="181" class="b">PWMB D6 · BIN1 D9 · BIN2 D10</text><text x="760" y="208" class="b">STBY D4</text><text x="760" y="238" class="s">VM ← battery motor rail</text><text x="760" y="261" class="s">VCC ← regulated 5 V · GND common</text>
<rect x="45" y="320" width="1045" height="105" rx="12" class="box"/><text x="68" y="352" class="h">Servo kicker</text><text x="68" y="379" class="b">Signal → A3 · +5 V → BEC · GND → common ground</text><text x="68" y="404" class="s">Power the servo from the regulated rail, not from an MCU I/O pin.</text>
<rect x="45" y="455" width="1045" height="100" rx="12" class="box"/><text x="68" y="487" class="h">Power</text><text x="68" y="515" class="b">Battery + → fuse → master switch → TB6612 VM</text><text x="68" y="540" class="b">Battery + → fuse/switch → buck/BEC → 5 V logic + servo + receiver</text>
</svg>