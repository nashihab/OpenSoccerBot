<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>
.title{font:700 30px Arial,sans-serif;fill:#18324a}.subtitle{font:15px Arial,sans-serif;fill:#526273}.h{font:700 20px Arial,sans-serif;fill:#18324a}.b{font:15px Arial,sans-serif;fill:#22313f}.s{font:13px Arial,sans-serif;fill:#526273}.tiny{font:12px Arial,sans-serif;fill:#66727f}.label{font:700 13px Arial,sans-serif;fill:#18324a}.box{fill:#fff;stroke:#b9c6d2;stroke-width:2}.blue{fill:#eaf3fb;stroke:#3978ad;stroke-width:2}.green{fill:#eef7eb;stroke:#67a653;stroke-width:2}.orange{fill:#fff4e9;stroke:#d88a3d;stroke-width:2}.purple{fill:#f4eef9;stroke:#8364a7;stroke-width:2}.wire{stroke:#3b4854;stroke-width:3;fill:none}.sig{stroke:#3978ad;stroke-width:3;fill:none}.pwr{stroke:#c34d4d;stroke-width:3;fill:none}.gnd{stroke:#4c7c57;stroke-width:3;fill:none}.dash{stroke:#7f8b96;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3b4854"/></marker><marker id="arrb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3978ad"/></marker><marker id="arrp" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c34d4d"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><text x="50" y="46" class="title">Build sequence</text>
<text x="50" y="73" class="subtitle">Work from the powertrain outward. Get one subsystem working before adding the next.</text><rect x="50" y="112" width="255" height="145" rx="12" class="box"/><circle cx="80" cy="142" r="19" fill="#18324a"/><text x="70" y="147" font="700 11px Arial" fill="#fff">01</text><text x="112" y="148" class="h">Choose motors</text><text x="66" y="191" class="s">Confirm motor voltage, gearbox speed</text><text x="66" y="213" class="s">and current before battery/driver selection.</text><rect x="337" y="112" width="255" height="145" rx="12" class="box"/><circle cx="367" cy="142" r="19" fill="#18324a"/><text x="357" y="147" font="700 11px Arial" fill="#fff">02</text><text x="399" y="148" class="h">Build chassis</text><text x="353" y="191" class="s">Mount matching wheels and keep</text><text x="353" y="213" class="s">the battery low and near the centre.</text><rect x="624" y="112" width="255" height="145" rx="12" class="box"/><circle cx="654" cy="142" r="19" fill="#18324a"/><text x="644" y="147" font="700 11px Arial" fill="#fff">03</text><text x="686" y="148" class="h">Wire power</text><text x="640" y="191" class="s">Battery → fuse → switch →</text><text x="640" y="213" class="s">motor rail + regulated logic rail.</text><rect x="911" y="112" width="255" height="145" rx="12" class="box"/><circle cx="941" cy="142" r="19" fill="#18324a"/><text x="931" y="147" font="700 11px Arial" fill="#fff">04</text><text x="973" y="148" class="h">Connect RC</text><text x="927" y="191" class="s">Wire receiver PWM channels and</text><text x="927" y="213" class="s">verify pulse direction and neutral.</text><rect x="50" y="290" width="255" height="145" rx="12" class="box"/><circle cx="80" cy="320" r="19" fill="#18324a"/><text x="70" y="325" font="700 11px Arial" fill="#fff">05</text><text x="112" y="326" class="h">Bench test</text><text x="66" y="369" class="s">Lift the wheels; verify neutral,</text><text x="66" y="391" class="s">direction and radio-loss stop.</text><rect x="337" y="290" width="255" height="145" rx="12" class="box"/><circle cx="367" cy="320" r="19" fill="#18324a"/><text x="357" y="325" font="700 11px Arial" fill="#fff">06</text><text x="399" y="326" class="h">Tune drive</text><text x="353" y="369" class="s">Set deadband, motor inversion,</text><text x="353" y="391" class="s">speed limit and mecanum mix.</text><rect x="624" y="290" width="255" height="145" rx="12" class="box"/><circle cx="654" cy="320" r="19" fill="#18324a"/><text x="644" y="325" font="700 11px Arial" fill="#fff">07</text><text x="686" y="326" class="h">Add mechanisms</text><text x="640" y="369" class="s">Install the kicker and dribbler</text><text x="640" y="391" class="s">after drive control is stable.</text><rect x="911" y="290" width="255" height="145" rx="12" class="box"/><circle cx="941" cy="320" r="19" fill="#18324a"/><text x="931" y="325" font="700 11px Arial" fill="#fff">08</text><text x="973" y="326" class="h">Field test</text><text x="927" y="369" class="s">Check acceleration, braking, turning,</text><text x="927" y="391" class="s">ball contact and motor temperature.</text><text x="50" y="500" class="h">Rule of thumb</text><text x="50" y="528" class="b">power → receiver → one motor → full drive → kicker/dribbler</text><text x="50" y="553" class="s">A fault is easier to find when only one new subsystem is introduced at a time.</text></svg>